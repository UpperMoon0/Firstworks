name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: firstworks-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew
      - name: Verify JVM tests, build, and GameTests
        run: ./gradlew --build-cache build runGameTestServer

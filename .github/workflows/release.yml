name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Firstworks
        run: ./gradlew clean build

      - name: Read mod version
        id: version
        run: |
          echo "value=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | xargs)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          tag="v${MOD_VERSION}"
          jar="build/libs/firstworks-${MOD_VERSION}.jar"
          test -f "$jar"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" \
              --title "Firstworks v${MOD_VERSION}" \
              --generate-notes
          fi
